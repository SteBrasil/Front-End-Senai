<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>header</title>

    <link rel="stylesheet" href="header.css">
    <style>

      
.header-simples {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  background-color: #1e293b;
  color: #ffffff;
  font-family: sans-serif;
}

.header-simples .logo {
  font-size: 20px;
  font-weight: bold;
}

.header-simples .menu {
  display: flex;
  list-style: none;
  gap: 20px;
  margin: 0;
  padding: 0;
}

.header-simples .menu a{
  color: #ffffff;
  text-decoration: none;
}  
    </style>
  </head>
  <body>
    <header class="header-simples">
      <div class="logo">Meu Site</div>
      <nav>
        <ul class="menu">
          <li><a href="#">Início</a></li>
          <li><a href="#">Sobre</a></li>
          <li><a href="#">Contato</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
